<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    
<h1>Statistic</h1>
<sup>*work in progress</sup>

<p>Number of fails: {{fail}}</p>
<p>Number of excellents: {{excellent}}</p>
<p>Average score: {{avg}}</p>

<table border="1">
    <caption>Leaderboard</caption>

    <tr>
        <th>Position</th>
        <th>Name</th>
        <th>Score</th>
    </tr>

    {% for s in top3 %}
    <tr>
        <td>{{ loop.index }}</td>
        <td>{{ s.first_name }} {{ s.last_name }}</td>
        <td>{{ s.score }}</td>
    </tr>
    {% endfor %}

</table>

<a href="/">Back</a>
</body>
</html>
